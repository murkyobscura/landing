<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="body__img-container">
      <header>
        <nav>
          <div class="nav__logo">
            <a href="#main__hero">Landing Test</a>
          </div>
          <div class="nav__links">
            <a href="#main__hero">Home</a>
            <a href="#main__products">Products</a>
            <a href="#footer__contacts">Contacts</a>
          </div>
          <div class="nav__btn">
            <a href="#">Sign up</a>
          </div>
        </nav>
      </header>

      <section id="main__hero">
        <h1>Lorem, ipsum.</h1>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit.</p>
        <p>Dolorum, quidem.</p>
      </section>
    </div>

    <section id="main__products">
      <h1 class="main__products-title">Our products</h1>
      <div class="main__products-grid">
        <div class="main__item" id="coffee1"></div>
        <div class="main__item" id="coffee2"></div>
        <div class="main__item" id="coffee3"></div>
        <div class="main__item" id="tea1"></div>
        <div class="main__item" id="tea2"></div>
        <div class="main__item" id="tea3"></div>
      </div>
    </section>

    <footer id="footer__contacts">
      <h1 class="footer__contact-us">Contact us</h1>
      <div class="footer__info">
        <div class="footer__contacts-block">
          <a href="https://vk.com/ultramoderne" target="_blank"
            ><i class="fa-brands fa-vk"></i> ultramoderne</a
          >
          <a href="https://github.com/murkyobscura" target="_blank"
            ><i class="fa-brands fa-github"></i> murkyobscura</a
          >
          <a href="mailto:murkyobscura@ya.ru" target="_blank"
            ><i class="fa-solid fa-envelope"></i> murkyobscura@ya.ru</a
          >
        </div>
        <div class="footer__separator"></div>
        <div class="footer__separator__mobile"></div>
        <div class="footer__map">
          <div class="footer__map-btn">
            <a href="https://yandex.ru/maps/-/CHVjZX4V" target="_blank"
              >Our location</a
            >
          </div>
          <iframe
            src="https://yandex.ru/map-widget/v1/?um=constructor%3Ab7343d20ec46832151999bbb7aff7b1de09e8b14b8a5aa19838445861df6b4ca&amp;source=constructor"
            frameborder="0"
          ></iframe>
        </div>
      </div>
    </footer>

</html>
